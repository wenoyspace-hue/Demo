input,select,textarea{width:100%;margin-top:6px;padding:12px 0;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--bone);font:400 1.05rem Manrope,Tajawal,sans-serif;border-radius:0;transition:border-color .3s}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
